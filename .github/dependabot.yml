version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - security
    ignore:
      # Major version migrations that need manual work:
      # TypeScript 6 — moduleResolution migration required
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Zod 4 — .refine() API changed, all schemas need audit
      - dependency-name: "zod"
        update-types: ["version-update:semver-major"]
    groups:
      fastify:
        patterns:
          - "fastify"
          - "@fastify/*"
      types:
        patterns:
          - "@types/*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - security
      - ui
    ignore:
      # Major version migrations that need manual work:
      # TypeScript 6 — CSS import type handling changed
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Tailwind 4 — config format completely replaced with CSS-native approach
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react*"
      vite:
        patterns:
          - "vite"
          - "@vitejs/*"
